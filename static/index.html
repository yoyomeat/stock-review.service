<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情绪流量化复盘</title>
  <link rel="stylesheet" href="/static/css/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="/static/css/kline.css?v=1">
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-logo">情绪流量化<span>v9.2 · 情绪流量化复盘系统</span></div>
    <a class="nav-item active" onclick="showPage('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      仪表盘
    </a>
    <a class="nav-item" onclick="showPage('review')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
      每日复盘
    </a>
    <a class="nav-item" onclick="showPage('trend')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      趋势分析
    </a>
    <a class="nav-item" onclick="showPage('position')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      持仓监控
    </a>
    <a class="nav-item" onclick="showPage('backtest')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      回测分析
    </a>
    <a class="nav-item" onclick="showPage('realtime')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      实时监控
    </a>
    <a class="nav-item" onclick="showPage('ipo')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      新股评分
    </a>
    <a class="nav-item" onclick="showPage('sentiment_review');loadSentimentReview()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      情绪复盘
    </a>
    <a class="nav-item" onclick="showPage('wave')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      K线图表
    </a>
    <a class="nav-item" onclick="showPage('trend_momentum');loadTrendMomentum()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
      趋势动量
    </a>
  </nav>

  <!-- Main Content -->
  <main class="main">
    <!-- Dashboard -->
    <div id="page-dashboard" class="page active">
      <div class="page-header">
        <div class="page-title">仪表盘</div>
        <div class="page-subtitle">市场情绪一览</div>
      </div>
      <div id="dashboard-loading" class="loading">加载中</div>
      <div id="dashboard-content" style="display:none"></div>
    </div>

    <!-- Review Detail -->
    <div id="page-review" class="page">
      <div class="page-header">
        <div class="page-title">每日复盘</div>
        <div class="page-subtitle">选择日期查看完整复盘报告</div>
      </div>
      <div class="date-picker">
        <select id="review-date-select"></select>
        <button onclick="loadReview()">查看</button>
      </div>
      <div id="review-content"></div>
    </div>

    <!-- Trend -->
    <div id="page-trend" class="page">
      <div class="page-header">
        <div class="page-title">趋势分析</div>
        <div class="page-subtitle">多日情绪/赚钱效应走势</div>
      </div>
      <div id="trend-content"></div>
    </div>

    <!-- Position -->
    <div id="page-position" class="page">
      <div class="page-header">
        <div class="page-title">持仓监控</div>
        <div class="page-subtitle">当前持仓与风险预警</div>
      </div>
      <div id="position-content"></div>
    </div>

    <!-- Backtest -->
    <div id="page-backtest" class="page">
      <div class="page-header">
        <div class="page-title">回测分析</div>
        <div class="page-subtitle">策略回测结果</div>
      </div>
      <div id="backtest-content"></div>
    </div>
  
    <!-- Realtime Monitor -->
    <div id="page-realtime" class="page">
      <div class="page-header">
        <div class="page-title">实时监控</div>
        <div class="page-subtitle">指数 · 板块 · 个股 实时行情</div>
      </div>
      <div id="realtime-content"></div>
    </div>

    <!-- IPO Score -->
    <div id="page-ipo" class="page">
      <div class="page-header">
        <div class="page-title">新股评分</div>
        <div class="page-subtitle">IPO量化行为分析 · 多维度评分</div>
      </div>
      <div id="ipo-content"></div>
    </div>
    <!-- K-Line Chart -->
    <div id="page-wave" class="page">
      <div class="page-header">
        <div class="page-title">K线图表</div>
        <div class="page-subtitle">搜索板块/指数，查看K线走势</div>
      </div>

      <!-- 搜索栏 -->
      <div class="kline-toolbar">
        <div class="kline-search-wrap">
          <input id="kline-search-input" type="text" placeholder="输入代码或名称搜索 (如: 上证、AI应用、885362)"
                 oninput="klineSearchInput(this.value)"
                 onfocus="if(this.value)klineSearchInput(this.value)"
                 onblur="setTimeout(()=>$('#kline-search-dropdown').style.display='none',200)">
          <div id="kline-search-dropdown" class="kline-dropdown"></div>
        </div>
        <div class="kline-period-bar">
          <button class="kline-period-btn active" data-period="daily" onclick="klineSetPeriod('daily')">日K</button>
          <button class="kline-period-btn" data-period="weekly" onclick="klineSetPeriod('weekly')">周K</button>
          <button class="kline-period-btn" data-period="monthly" onclick="klineSetPeriod('monthly')">月K</button>
        </div>
      </div>

      <!-- 分类筛选 -->
      <div id="kline-cat-bar" class="kline-cat-bar"></div>

      <!-- K线图 -->
      <div id="kline-chart-title" class="kline-chart-title"></div>
      <div id="kline-chart-container" class="kline-chart-container">
        <div class="kline-loading">搜索板块或指数开始查看</div>
      </div>

      <!-- 快捷入口 -->
      <div class="kline-quick">
        <span class="kline-quick-label">快捷:</span>
        <button onclick="klineLoadCode('sh000001')">上证指数</button>
        <button onclick="klineLoadCode('sz399006')">创业板指</button>
        <button onclick="klineLoadCode('sh000688')">科创50</button>
        <button onclick="klineLoadCode('886108')">AI应用</button>
        <button onclick="klineLoadCode('886069')">人形机器人</button>
        <button onclick="klineLoadCode('885700')">军工</button>
        <button onclick="klineLoadCode('885728')">人工智能</button>
        <button onclick="klineLoadCode('885517')">机器人概念</button>
      </div>
    </div>
  
  <!-- 趋势动量评分 -->
  <div id="page-trend_momentum" class="page"></div>

  <!-- 情绪复盘 -->
  <div id="page-sentiment_review" class="page">
    <div class="page-header">
      <div class="page-title">情绪复盘</div>
      <div class="page-subtitle">情绪周期序列 · 客观盘面 · 主观复盘 · 预案与回填</div>
    </div>
    <div id="sentiment-loading" class="loading">加载中</div>
    <div id="sentiment-content" style="display:none"></div>
  </div>

</main>
</div>

<script src="/static/js/config.js?v=1"></script>
<script src="/static/js/app.js?v=4"></script>
<script src="/static/js/dashboard.js?v=4"></script>
<script src="/static/js/dashboard_today.js"></script>
<script src="/static/js/review.js"></script>
<script src="/static/js/trend.js"></script>
<script src="/static/js/position.js"></script>
<script src="/static/js/backtest.js"></script>
<script src="/static/js/realtime.js?v=5"></script>
<script src="/static/js/ipo.js?v=2"></script>
<script src="/static/js/kline.js?v=1"></script>
<script src="/static/js/trend_momentum.js?v=7"></script>
<link rel="stylesheet" href="/static/css/sentiment_review.css?v=1">
<script src="/static/js/sentiment_review.js?v=10"></script>
</body>
</html>
